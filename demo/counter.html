<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Counter</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; display: flex; justify-content: center; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; width: 300px; text-align: center; }
    #count { font-size: 2.5rem; font-weight: bold; margin: 1rem 0; }
    button { padding: 0.75rem 1.5rem; margin: 0 0.5rem; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; }
    #increment-btn { background: #10b981; }
    #decrement-btn { background: #ef4444; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Counter Demo</h2>
    <div id="count">0</div>
    <div>
      <button type="button" id="decrement-btn">-</button>
      <button type="button" id="increment-btn">+</button>
    </div>
  </div>
  <script>
    let val = 0;
    const countEl = document.getElementById("count");
    document.getElementById("increment-btn").addEventListener("click", () => {
      val++;
      countEl.innerText = String(val);
    });
    document.getElementById("decrement-btn").addEventListener("click", () => {
      val--;
      countEl.innerText = String(val);
    });
  </script>
</body>
</html>
