<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notes</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; display: flex; justify-content: center; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; width: 360px; }
    input { width: 70%; padding: 0.6rem; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 6px; }
    button { padding: 0.6rem 1rem; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    ul { list-style: none; padding: 0; margin-top: 1rem; }
    li { background: #0f172a; padding: 0.5rem; margin-bottom: 0.5rem; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Notes App</h2>
    <div style="display:flex; gap:0.5rem;">
      <input type="text" id="note-input" placeholder="New note..." />
      <button type="button" id="add-btn">Add</button>
    </div>
    <ul id="notes-list"></ul>
    <p id="empty-hint" style="color:#94a3b8; font-size:0.875rem;">No notes yet.</p>
  </div>
  <script>
    document.getElementById("add-btn").addEventListener("click", () => {
      const inp = document.getElementById("note-input");
      const text = inp.value.trim();
      if (text) {
        const li = document.createElement("li");
        li.innerText = text;
        document.getElementById("notes-list").appendChild(li);
        document.getElementById("empty-hint").style.display = "none";
        inp.value = "";
      }
    });
  </script>
</body>
</html>
