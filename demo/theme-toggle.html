<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Theme Toggle</title>
  <style>
    body.light { background: #f8fafc; color: #0f172a; }
    body.dark { background: #0f172a; color: #f8fafc; }
    body { font-family: sans-serif; padding: 2rem; display: flex; justify-content: center; }
    .card { padding: 2rem; border-radius: 12px; border: 1px solid #ccc; width: 300px; text-align: center; }
    button { padding: 0.75rem 1.25rem; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 1rem; }
  </style>
</head>
<body class="light">
  <div class="card">
    <h2>Theme Switcher</h2>
    <div id="theme-label" style="font-size:1.25rem; font-weight:bold;">Light mode</div>
    <button type="button" id="toggle-btn">Toggle Theme</button>
  </div>
  <script>
    const btn = document.getElementById("toggle-btn");
    const lbl = document.getElementById("theme-label");
    btn.addEventListener("click", () => {
      if (document.body.classList.contains("light")) {
        document.body.classList.remove("light");
        document.body.classList.add("dark");
        lbl.innerText = "Dark mode";
      } else {
        document.body.classList.remove("dark");
        document.body.classList.add("light");
        lbl.innerText = "Light mode";
      }
    });
  </script>
</body>
</html>
