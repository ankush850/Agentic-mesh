<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; display: flex; justify-content: center; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; width: 400px; }
    input, textarea { width: 100%; padding: 0.6rem; margin-bottom: 1rem; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 0.75rem; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    #confirmation { display: none; color: #10b981; margin-top: 1rem; font-weight: bold; }
    #error { display: none; color: #ef4444; margin-top: 1rem; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Contact Us</h1>
    <input type="text" id="name" placeholder="Your Name" />
    <input type="email" id="email" placeholder="Your Email" />
    <textarea id="message" placeholder="Message"></textarea>
    <button type="button" id="submit-btn">Submit</button>
    <div id="confirmation"></div>
    <div id="error"></div>
  </div>
  <script>
    document.getElementById("submit-btn").addEventListener("click", () => {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const msg = document.getElementById("message").value.trim();
      const conf = document.getElementById("confirmation");
      const err = document.getElementById("error");

      if (!name || !email || !msg) {
        err.innerText = "Please fill all fields";
        err.style.display = "block";
        conf.style.display = "none";
      } else {
        conf.innerText = "Thank you, " + name + "! Your message has been sent.";
        conf.style.display = "block";
        err.style.display = "none";
      }
    });
  </script>
</body>
</html>
