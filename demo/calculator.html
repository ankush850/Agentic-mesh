<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator Demo</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; display: flex; justify-content: center; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; width: 340px; }
    input { width: 100%; padding: 0.6rem; margin-bottom: 1rem; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 6px; }
    button { width: 100%; padding: 0.75rem; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    #result { margin-top: 1.5rem; font-size: 1.2rem; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Calculator</h2>
    <input type="number" id="num1" placeholder="First number" />
    <input type="number" id="num2" placeholder="Second number" />
    <button type="button" id="add-btn">Add</button>
    <div id="result">Sum: 0</div>
  </div>
  <script>
    document.getElementById("add-btn").addEventListener("click", () => {
      const v1 = parseFloat(document.getElementById("num1").value) || 0;
      const v2 = parseFloat(document.getElementById("num2").value) || 0;
      document.getElementById("result").innerText = "Sum: " + (v1 + v2);
    });
  </script>
</body>
</html>
