<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Strength</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; display: flex; justify-content: center; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; width: 340px; }
    input { width: 100%; padding: 0.6rem; margin-bottom: 1rem; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 6px; box-sizing: border-box; }
    #strength-label { font-weight: bold; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Password Strength</h2>
    <input type="password" id="password-input" placeholder="Type password..." />
    <div>Strength: <span id="strength-label"></span></div>
  </div>
  <script>
    document.getElementById("password-input").addEventListener("input", (e) => {
      const p = e.target.value;
      const lbl = document.getElementById("strength-label");
      if (!p) {
        lbl.innerText = "";
        return;
      }
      const hasUpper = /[A-Z]/.test(p);
      const hasDigit = /[0-9]/.test(p);
      const hasSymbol = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(p);
      
      if (p.length >= 8 && hasUpper && hasDigit && hasSymbol) {
        lbl.innerText = "Strong";
        lbl.style.color = "#10b981";
      } else if (p.length >= 6 && (hasUpper || hasDigit)) {
        lbl.innerText = "Medium";
        lbl.style.color = "#f59e0b";
      } else {
        lbl.innerText = "Weak";
        lbl.style.color = "#ef4444";
      }
    });
  </script>
</body>
</html>
